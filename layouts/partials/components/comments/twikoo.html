{{- $theme := site.Params -}}
{{- $t := $theme.comment.config.twikoo -}}
{{- if and (eq $theme.comment.system "twikoo") $t.server_url }}
    <div class="twikoo-container">
        <script {{ if $theme.global.single_page }}data-swup-reload-script {{ end }}
                src='https://cdnjs.cloudflare.com/ajax/libs/twikoo/{{ $t.version | default "1.6.10" }}/twikoo.all.min.js'
        ></script>
        <div id="twikoo-comment"></div>
        <script {{ if $theme.global.single_page }}data-swup-reload-script{{ end }}>
            (function() {
                const startPath = location.pathname;
                const startTime = Date.now();
                const retryDelay = 200;
                const retryLimit = 5000;

                const runTwikoo = () => {
                    if (location.pathname !== startPath) {
                        return;
                    }

                    const container = document.getElementById('twikoo-comment');
                    if (!container || typeof twikoo === 'undefined') {
                        if (Date.now() - startTime < retryLimit) {
                            setTimeout(runTwikoo, retryDelay);
                        }
                        return;
                    }

                    container.innerHTML = '';
                    twikoo.init({
                        el: '#twikoo-comment',
                        envId: '{{ $t.server_url }}',
                        {{- if $t.region }}
                        region: '{{ $t.region }}',
                        {{- end }}
                        path: location.pathname,
                    });
                };

                runTwikoo();
            })();
        </script>
    </div>
{{- end }}
