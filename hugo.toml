# Theme Redefine for Hugo — default configuration
# Migrated from hexo-theme-redefine v2.9.0 (https://github.com/EvanNotFound/hexo-theme-redefine)
# Site-level values in your site's hugo.toml override everything below.
_merge = "deep"

[params]
# Date/time layouts, moment.js tokens are converted automatically (YYYY-MM-DD etc.)
date_format = "YYYY-MM-DD"
time_format = "HH:mm:ss"

# BASIC INFORMATION -----------------------------------------------------------
[params.info]
title = ""            # falls back to site title when empty
subtitle = ""         # falls back to site subtitle when empty
author = ""           # falls back to site author when empty
url = ""              # falls back to site baseURL when empty

# IMAGE CONFIGURATION --------------------------------------------------------
[params.defaults]
favicon = "/images/redefine-favicon.svg"
logo = ""
avatar = "/images/redefine-avatar.svg"

# COLORS ---------------------------------------------------------------------
[params.colors]
primary = "#A31F34"
secondary = ""
default_mode = "light" # light, dark

# SITE CUSTOMIZATION ---------------------------------------------------------
[params.global]
content_max_width = "1000px"
sidebar_width = "210px"
single_page = true

[params.global.fonts.chinese]
enable = false
family = ""
url = ""
[params.global.fonts.english]
enable = false
family = ""
url = ""
[params.global.fonts.title]
enable = false
family = ""
url = ""

[params.global.hover]
shadow = true
scale = false

[params.global.scroll_progress]
bar = false
percentage = true

[params.global.website_counter]
url = "https://cn.vercount.one/js"
enable = true
site_pv = true
site_uv = true
post_pv = true

[params.global.preloader]
enable = false
custom_message = ""

[params.global.side_tools]
gear_rotation = true
auto_expand = false

[params.global.open_graph]
enable = true
image = "/images/redefine-og.webp"
description = ""

[params.global.google_analytics]
enable = false
id = ""

# FONTAWESOME PRO ------------------------------------------------------------
[params.fontawesome]
thin = false
light = false
duotone = false
sharp_solid = false

# HOME BANNER ----------------------------------------------------------------
[params.home_banner]
enable = true
style = "fixed" # static or fixed

[params.home_banner.image]
light = "/images/wallhaven-wqery6-light.webp"
dark = "/images/wallhaven-wqery6-dark.webp"

title = ""

[params.home_banner.subtitle]
# subtitle text, array (or a single string)
text = []
typing_speed = 100
backing_speed = 80
starting_delay = 500
backing_delay = 1500
loop = true
smart_backspace = true

[params.home_banner.subtitle.hitokoto]
enable = false
show_author = false
api = "https://v1.hitokoto.cn"

[params.home_banner.text_color]
light = "#fff"
dark = "#d1d1b6"

[params.home_banner.text_style]
title_size = "2.8rem"
subtitle_size = "1.5rem"
line_height = 1.2

[params.home_banner.custom_font]
enable = false
family = ""
url = ""

[params.home_banner.social_links]
enable = false
style = "default" # default, reverse, center
# links = [{icon = "github", url = "https://github.com/you"}]
# qrs = [{icon = "weixin", qr = "/images/qr.png"}]

# NAVIGATION BAR -------------------------------------------------------------
[params.navbar]
auto_hide = false

[params.navbar.color]
left = "#f78736"
right = "#367df7"
transparency = 35

[params.navbar.width]
home = "1200px"
pages = "1000px"

[params.navbar.search]
enable = false
preload = true

# HOME PAGE ------------------------------------------------------------------
[params.home]
article_date_format = "auto" # auto, relative, or a date layout like 2006-01-02
excerpt_length = 200

[params.home.sidebar]
enable = true
position = "left" # left, right
first_item = "menu" # menu, info
announcement = ""
show_on_mobile = true

[params.home.categories]
enable = true
limit = 3

[params.home.tags]
enable = true
limit = 3

# ARTICLE --------------------------------------------------------------------
[params.articles]
lazyload = true
pangu_js = false

[params.articles.style]
font_size = "16px"
line_height = 1.5
image_border_radius = "14px"
image_alignment = "center"
image_caption = false
link_icon = true
delete_mask = false
title_alignment = "left" # left, center

[params.articles.style.headings_top_spacing]
h1 = "3.2rem"
h2 = "2.4rem"
h3 = "1.9rem"
h4 = "1.6rem"
h5 = "1.4rem"
h6 = "1.3rem"

[params.articles.word_count]
enable = true
count = true
min2read = true

[params.articles.author_label]
enable = true
auto = false
# list = ["Lv1", "Lv2", "Lv3"]

[params.articles.code_block]
copy = true
style = "mac" # mac | simple

[params.articles.code_block.highlight_theme]
light = "github"   # github, atom-one-light, default
dark = "vs2015"    # github-dark, monokai-sublime, vs2015, night-owl, atom-one-dark, nord, tokyo-night-dark, a11y-dark, agate

[params.articles.code_block.font]
enable = false
family = ""
url = ""

[params.articles.toc]
enable = true
max_depth = 3
number = false
expand = true
init_open = true

[params.articles.copyright]
enable = true
default = "cc_by_nc_sa"

[params.articles.recommendation]
enable = false
title = "Recommended Reading"
limit = 3
mobile_limit = 2
placeholder = "/images/wallhaven-wqery6-light.webp"
# skip_dirs = ["posts/secret/"]

# COMMENT --------------------------------------------------------------------
[params.comment]
enable = true
system = "" # waline, gitalk, twikoo, giscus, utterances, artalk

[params.comment.config.waline]
serverUrl = ""
lang = "zh-CN"
# emoji = []
reaction = false

[params.comment.config.gitalk]
clientID = ""
clientSecret = ""
repo = ""
owner = ""
proxy = ""

[params.comment.config.twikoo]
version = "1.6.10"
server_url = ""
region = ""

[params.comment.config.giscus]
repo = ""
repo_id = ""
category = ""
category_id = ""
mapping = "pathname"
strict = "0"
reactions_enabled = "1"
emit_metadata = "0"
lang = "en"
input_position = "bottom"
loading = "lazy"

[params.comment.config.artalk]
server = ""
site = ""

[params.comment.config.utterances]
repo = ""
issue_term = "pathname"
issue_number = ""
label = ""
theme_light = "github-light"
theme_dark = "github-dark"

# FOOTER ---------------------------------------------------------------------
[params.footer]
runtime = true
icon = '<i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s; color: #f54545"></i>'
start = "2022/8/17 11:45:14"
statistics = true
customize = ""

[params.footer.icp]
enable = false
number = ""
url = ""

# INJECT ---------------------------------------------------------------------
[params.inject]
enable = false
# head = ['<script>...</script>']
# footer = ['<script>...</script>']

# PLUGINS --------------------------------------------------------------------
[params.plugins.feed]
enable = true

[params.plugins.aplayer]
enable = false
type = "fixed" # fixed, mini
# audios = [{name = "...", artist = "...", url = "...", cover = "...", lrc = "..."}]

[params.plugins.mathjax]
enable = true

[params.plugins.mermaid]
enable = false
version = "11.4.1"
[params.plugins.mermaid.theme]
light = "default"
dark = "dark"

# PAGE TEMPLATES -------------------------------------------------------------
[params.page_templates]
friends_column = 2
tags_style = "blur" # blur, cloud

[params.page_templates.masonry]
batch_size = 12
initial_batch_size = 24

# CDN ------------------------------------------------------------------------
[params.cdn]
enable = false
provider = "npmmirror" # npmmirror, zstatic, cdnjs, jsdelivr, unpkg, custom
custom_url = ""

# DEVELOPER MODE -------------------------------------------------------------
[params.developer]
enable = false

# THEME INTERNAL -------------------------------------------------------------
[params.theme_internal]
version = "2.9.0"

# ---------------------------------------------------------------------------
[markup]
defaultMarkdownHandler = "goldmark"

[markup.highlight]
codeFences = true
noClasses = false
lineNos = true
lineNumbersInTable = true
anchorLineNos = false
guessSyntax = false

[markup.goldmark.extensions.passthrough]
enabled = true
[markup.goldmark.extensions.passthrough.delimiters]
inline = [['\(', '\)']]
block = [['\[', '\]'], ['$$', '$$']]

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions]
strikethrough = true

[markup.tableOfContents]
startLevel = 1
endLevel = 6

[outputs]
home = ["HTML", "Search"]

[outputFormats]
[outputFormats.Search]
mediaType = "application/xml"
baseName = "search"
isPlainText = true
notAlternative = true

[outputFormats.MasonryData]
mediaType = "application/json"
baseName = "data"
isPlainText = true
notAlternative = true

[related]
includeNewer = false
threshold = 4
toLower = true

[[related.indices]]
name = "tags"
weight = 100

[[related.indices]]
name = "categories"
weight = 80

[[related.indices]]
name = "keywords"
weight = 60

[taxonomies]
tag = "tags"
category = "categories"

[sitemap]
changefreq = "weekly"
